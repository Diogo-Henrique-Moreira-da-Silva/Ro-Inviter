<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Confirmar presença</title>
</head>
<body>
    <main class="formulario">
        <h1>Confirmar presença</h1>
        <p class="convite">Os 50 anos da nossa mãe estão chegando, e essa comemoração só vai ficar completa com pessoas especiais por perto. Posso contar com você? Essa é uma festa surpresa, então não conte para ela, hein!</p>

        <form id="form-confirmacao">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Insira seu nome completo" autocomplete="name" required>
            </div>

            <fieldset class="campo caixa-presenca">
                <legend>Você irá ao evento?</legend>
                <div class="opcoes-presenca">
                    <label class="opcao" for="sim"><input type="radio" id="sim" name="presenca" value="sim" required> Sim</label>
                    <label class="opcao" for="nao"><input type="radio" id="nao" name="presenca" value="nao" required> Não</label>
                </div>
            </fieldset>

            <div id="area-quantidades" class="escondido">
                <div class="campo campo-quantidade">
                    <div class="texto-campo">
                        <label for="adultos">Quantidade de adultos incluindo você</label>
                        <small>(10 anos ou mais)</small>
                    </div>
                    <select id="adultos" name="adultos" disabled>
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div class="campo campo-quantidade">
                    <div class="texto-campo">
                        <label for="criancas">Quantidade de crianças</label>
                        <small>(menores de 10 anos)</small>
                    </div>
                    <select id="criancas" name="criancas" disabled>
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btn-enviar">Confirmar</button>
        </form>
    </main>
</body>
</html>
